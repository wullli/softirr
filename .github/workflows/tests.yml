name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test with coverage
        run: |
          pytest --cov=soft_irr --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            curl -fsSL https://uploader.codecov.io/latest/linux/codecov -o codecov
            chmod +x codecov
            ./codecov -f coverage.xml -t "${CODECOV_TOKEN}" || true
          fi
